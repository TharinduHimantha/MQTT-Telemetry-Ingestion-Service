spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mqtt_sensor_data
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

mqtt:
  broker: tcp://broker.hivemq.com:1883
  client-id: spring-mqtt-consumer
  topic: thw/telemetry/#
  qos: 1
